<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="fpi-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="fpi-accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Abstract Pattern Investigation Network Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Hex Shield Boundary -->
    <path d="M22 2 L40 12 L40 32 L22 42 L4 32 L4 12 Z" fill="url(#fpi-emerald-grad)" opacity="0.15" stroke="url(#fpi-emerald-grad)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Connected Neural / Evidence Graph Nodes -->
    <path d="M14 16 L22 10 L30 16 L30 28 L22 34 L14 28 Z" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 10 L22 34" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M14 16 L30 28" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M30 16 L14 28" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Active Investigation Pulse Points -->
    <circle cx="22" cy="22" r="3.5" fill="#34d399" />
    <circle cx="14" cy="16" r="2.5" fill="#0d9488" />
    <circle cx="30" cy="16" r="2.5" fill="#0d9488" />
    <circle cx="22" cy="10" r="2" fill="#10b981" />
    <circle cx="22" cy="34" r="2" fill="#10b981" />
  </g>

  <!-- Typography: FPI -->
  <text x="62" y="32" font-family="'Nunito', sans-serif" font-weight="900" font-size="24" letter-spacing="1" fill="currentColor">FPI</text>
  
  <!-- Sub-label: FRAUD PATTERN INVESTIGATOR -->
  <text x="62" y="44" font-family="'Nunito', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="#0d9488">FRAUD PATTERN INVESTIGATOR</text>
</svg>
